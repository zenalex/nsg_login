name: nsg_login
description: Визуальные компоненты для авторизации и регистрации пользователей в приложениях NSG. Поддерживает вход по телефону, email и паролю с SMS-верификацией.
version: 1.0.0-beta.1
homepage: https://github.com/zenalex/nsg_login
repository: https://github.com/zenalex/nsg_login
issue_tracker: https://github.com/zenalex/nsg_login/issues
documentation: https://github.com/zenalex/nsg_login
license: MIT
topics:
  - authentication
  - login
  - ui
  - widgets
  - forms
publish_to: 'none' # Раскомментируйте эту строку, если не хотите публиковать пакет

environment:
  sdk: ">=3.8.1 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # nsg_data: ^1.0.0
  # nsg_controls: ^1.0.0-beta.1
  # git-зависимости по умолчанию (для CI и встраивания в потребителях через git).
  # Локальная разработка: pubspec_overrides.yaml с path: ../nsg_data и ../nsg_controls
  # — см. .example.
  nsg_data:
    git:
      url: https://github.com/zenalex/nsg_data.git
      ref: master
  nsg_controls:
    git:
      url: https://github.com/zenalex/nsg_controls.git
      ref: master

  get: ^5.0.0-beta.52
  hovering: ^1.0.4
  flutter_multi_formatter: ^2.13.10
  shared_preferences: ^2.0.6
  flutter_svg: ^2.2.0 
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  # Диапазон, а не ^6.1.4: nsg_messenger тянет транзитивно
  # serverpod_auth_idp_flutter -> sign_in_with_apple ^7.0.1, и жёсткая
  # ^6.1.4 здесь роняла version solving у всех потребителей.
  # Широкий диапазон оставляет совместимость с 6.x.
  sign_in_with_apple: '>=6.1.4 <8.0.0'
  crypto: ^3.0.6
  http: ^1.4.0
  telegram_login_flutter: ^1.0.1
  # Пропатченный flutter_login_vk (форк 3.0.0), а не pub-версия.
  #
  # Штатный плагин в ActivityListener зовёт VK.onActivityResult БЕЗУСЛОВНО —
  # не проверяя ни свой ли это requestCode, ни инициализацию VK SDK. Flutter
  # раздаёт результат activity ВСЕМ плагинам, поэтому в продукте, который не
  # использует VK-вход (VK.initialize() не вызывается никогда), ЛЮБОЙ выбор
  # файла/фото ронял приложение:
  #   UninitializedPropertyAccessException: lateinit property authManager
  # В форке — ранний выход, если VK-логина не ждём, плюс catch.
  #
  # Зависимость путём, а НЕ dependency_overrides: overrides действуют только
  # в корневом приложении, поэтому из библиотеки так не починить — каждый
  # продукт был бы обязан помнить про костыль. Здесь исправление получают все.
  flutter_login_vk:
    path: packages/flutter_login_vk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  generate: true
  assets:
    - assets/images/logo.png
